name: DNSPod sync
run-name: "${{ inputs.trigger_source == 'cloudflare-cron' && '定时同步' || inputs.trigger_source == 'clock-validation' && '定时链路验证：同步' || '手动同步' }} · ${{ inputs.mode || 'apply' }}"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'observe: sources only; plan: read only; frozen: full sync requiring freeze; apply: normal sync'
        type: choice
        options: [observe, plan, frozen, apply]
        default: plan
      trigger_source:
        description: 'Clock source; the worker supplies this automatically'
        type: choice
        options: [manual, cloudflare-cron, clock-validation]
        default: manual
      scheduled_at:
        description: 'UTC clock timestamp for tracing delivery delay'
        type: string
permissions:
  contents: read
concurrency:
  group: cf-dnspod-background
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - run: npm ci --no-audit --no-fund
      - name: Run existing Node sync entry
        run: node scripts/actions-sync.mjs
        env:
          RUN_MODE: ${{ inputs.mode || 'apply' }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
