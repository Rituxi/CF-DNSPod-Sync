name: Temporary schedule diagnostic
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  event:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Identify the triggering event
        run: printf 'event=%s run=%s at=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)"
