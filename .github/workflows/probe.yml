name: Three-carrier probe
run-name: "${{ inputs.trigger_source == 'cloudflare-cron' && '定时三网探测' || inputs.trigger_source == 'clock-validation' && '定时链路验证：探测' || '手动三网探测' }}"
on:
  workflow_dispatch:
    inputs:
      require_frozen:
        description: 'Require publication freeze during migration validation'
        type: boolean
        default: true
      trigger_source:
        description: 'Clock source; the worker supplies this automatically'
        type: choice
        options: [manual, cloudflare-cron, clock-validation]
        default: manual
      scheduled_at:
        description: 'UTC clock timestamp for tracing delivery delay'
        type: string
permissions:
  contents: read
concurrency:
  group: cf-dnspod-background
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - run: npm ci --no-audit --no-fund
      - name: Schedule real mainland carrier probes
        run: node probe.mjs
        env:
          REQUIRE_PUBLICATION_FROZEN: ${{ inputs.require_frozen && 'true' || 'false' }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
